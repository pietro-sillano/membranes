<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://kit.fontawesome.com/e308efa3ec.js" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MesoMem - Mesoscale Membrane Model</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="hero-meso">
        <a href="index.html" class="home-button"><i class="fas fa-home"></i></a>
        <h1>MesoMem</h1>
        <p>A solvent-free, one-particle-thick, coarse-grained model for lipid bilayers</p>
        <div class="hero-actions">
            <a href="https://arxiv.org/abs/2602.24123" class="btn-premium"><i class="fas fa-file-alt"></i> Arxiv Paper</a>
            <a href="https://gitlab.tudelft.nl/idema-group/mesomem" class="btn-premium"><i class="fab fa-gitlab"></i> GitLab Repo</a>
        </div>
    </header>

    <main>
        <div class="video-grid">
            <div class="video-card">
                <video controls>
                    <source src="assets/plane.mp4" type="video/mp4">
                </video>
                <h2>Planar Membrane Dynamics</h2>
            </div>
            <div class="video-card">
                <video controls>
                    <source src="assets/phase_sep.mp4" type="video/mp4">
                </video>
                <h2>Phase Separation</h2>
            </div>
            <div class="video-card">
                <video controls>
                    <source src="assets/tube.mp4" type="video/mp4">
                </video>
                <h2>Tube Formation</h2>
            </div>
        </div>

        <div style="text-align: center; margin: 4rem 0;">
            <a href="#" class="btn-premium">Featured Use & Works</a>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p><a href="mailto:p.sillano@tudelft.nl">Contact</a></p>
        </div>
    </footer>
</body>
</html>
